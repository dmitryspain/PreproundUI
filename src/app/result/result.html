<header class="page-head">
  <p class="eyebrow">{{ 'result.eyebrow' | t }}</p>
  <h1 class="page-title">{{ 'result.title' | t }}</h1>
</header>

@if (view; as view) {
  <app-result-view [result]="view">
    <div class="actions">
      @if (retryError(); as message) {
        <p class="callout error" role="alert">{{ message }}</p>
      }
      <button
        type="button"
        class="btn btn-primary btn-wrap"
        [disabled]="retrying()"
        (click)="retry()"
      >
        {{ 'result.retry' | t }}
      </button>
      <a class="btn btn-wrap" routerLink="/">{{ 'result.newSetup' | t }}</a>
    </div>
  </app-result-view>
}
